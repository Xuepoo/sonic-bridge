name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sonic-bridge-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sonic-bridge-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sonic-bridge-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sonic-bridge-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sonic-bridge-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/sonic-bridge ${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/sonic-bridge.exe ${{ matrix.artifact_name }}.exe

      - name: Package for Linux distributions
        if: runner.os == 'Linux'
        run: |
          ARCH_TYPE=$(uname -m)
          if [ "$ARCH_TYPE" = "aarch64" ]; then
            NFPM_ARCH="arm64"
            ARCH="arm64"
            PKG_ARCH="aarch64"
          else
            NFPM_ARCH="x86_64"
            ARCH="amd64"
            PKG_ARCH="x86_64"
          fi
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm

          # Prepare binary for nFPM
          cp ${{ matrix.artifact_name }} ./sonic-bridge
          chmod +x ./sonic-bridge

          # Extract version robustly
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" == refs/heads/* ]] || [[ "$VERSION" == refs/pull/* ]] || [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi

          export VERSION
          export ARCH
          ./nfpm pkg --packager deb --target sonic-bridge-linux-${PKG_ARCH}.deb
          ./nfpm pkg --packager rpm --target sonic-bridge-linux-${PKG_ARCH}.rpm
          ./nfpm pkg --packager archlinux --target sonic-bridge-linux-${PKG_ARCH}.pkg.tar.zst

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            *.deb
            *.rpm
            *.pkg.tar.zst

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish sonic-bridge
        run: cargo publish --no-verify --allow-dirty || echo "Crate version might already be published, skipping..."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib sudo fakeroot binutils make gcc pkgconf

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # Sync to /root/.ssh for standard ssh client compatibility in containers
          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

      - name: Configure Git
        run: |
          git config --system --add safe.directory '*'
          git config --global user.name "Xuepoo (CI)"
          git config --global user.email "xuepoofoter@gmail.com"

      - name: Create Arch AUR builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Update AUR source package (sonic-bridge)
        run: |
          git clone ssh://aur@aur.archlinux.org/sonic-bridge.git aur-src
          cd aur-src
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}
          sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push -f origin master

      - name: Update AUR binary package (sonic-bridge-bin)
        run: |
          git clone ssh://aur@aur.archlinux.org/sonic-bridge-bin.git aur-bin
          cd aur-bin
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}

          # 等待 GitHub Release 资产在 CDN 生效，避免 updpkgsums 下载到 404 页面算出错误的 sha256
          URL="https://github.com/Xuepoo/sonic-bridge/releases/download/v${CLEAN_VERSION}/sonic-bridge-linux-x86_64"
          echo "[*] Checking if release asset is available: $URL"
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "[+] Asset is ready (HTTP 200)!"
              break
            fi
            echo "[-] Asset not ready yet (HTTP $STATUS). Waiting 10s... (Attempt $i/30)"
            sleep 10
          done

          cat > PKGBUILD << 'EOF'
          # Maintainer: Xuepoo <xuepoofoter@gmail.com>
          pkgname=sonic-bridge-bin
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="An ultra-fast, lightweight physical music aesthetic and listening translation middleware for AI Agents under the LRMD protocol. (Pre-compiled)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Xuepoo/sonic-bridge"
          license=('MIT')
          provides=('sonic-bridge')
          conflicts=('sonic-bridge')
          source=("LICENSE-VERSION_PLACEHOLDER::https://raw.githubusercontent.com/Xuepoo/sonic-bridge/vVERSION_PLACEHOLDER/LICENSE")
          source_x86_64=("sonic-bridge-linux-x86_64-VERSION_PLACEHOLDER::https://github.com/Xuepoo/sonic-bridge/releases/download/vVERSION_PLACEHOLDER/sonic-bridge-linux-x86_64")
          source_aarch64=("sonic-bridge-linux-aarch64-VERSION_PLACEHOLDER::https://github.com/Xuepoo/sonic-bridge/releases/download/vVERSION_PLACEHOLDER/sonic-bridge-linux-aarch64")
          sha256sums=('a0609908bbcd4b5a91e8e2ce9e302a7adfc57957d16ad3ef5ef532839e186243')
          sha256sums_x86_64=('SKIP')
          sha256sums_aarch64=('SKIP')

          package() {
            install -Dm755 "$srcdir/sonic-bridge-linux-$CARCH-VERSION_PLACEHOLDER" "$pkgdir/usr/bin/sonic-bridge"
            install -Dm644 "$srcdir/LICENSE-VERSION_PLACEHOLDER" "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
          }
          EOF
          sed -i "s/VERSION_PLACEHOLDER/${CLEAN_VERSION}/g" PKGBUILD
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push -f origin master

  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256
        id: sha
        run: |
          VERSION="${{ github.ref_name }}"
          CLEAN_VERSION=${VERSION#v}
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

          # Wait for release to be fully propagated to prevent download failures during formula test
          sleep 15

          # Read sha256 of binaries
          SHA_LINUX=$(sha256sum artifacts/sonic-bridge-linux-x86_64/sonic-bridge-linux-x86_64 | awk '{print $1}')
          SHA_MACOS_X86=$(sha256sum artifacts/sonic-bridge-macos-x86_64/sonic-bridge-macos-x86_64 | awk '{print $1}')
          SHA_MACOS_ARM=$(sha256sum artifacts/sonic-bridge-macos-aarch64/sonic-bridge-macos-aarch64 | awk '{print $1}')

          echo "sha_linux=${SHA_LINUX}" >> "$GITHUB_OUTPUT"
          echo "sha_macos_x86=${SHA_MACOS_X86}" >> "$GITHUB_OUTPUT"
          echo "sha_macos_arm=${SHA_MACOS_ARM}" >> "$GITHUB_OUTPUT"

      - name: Update Formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/Xuepoo/homebrew-tap.git"

          git clone "${REPO_URL}" tap
          cd tap
          mkdir -p Formula

          cat > Formula/sonic-bridge.rb << 'FORMULA'
          class SonicBridge < Formula
            desc "An ultra-fast, lightweight physical music aesthetic and listening translation middleware designed for AI Agents"
            homepage "https://github.com/Xuepoo/sonic-bridge"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Xuepoo/sonic-bridge/releases/download/vVERSION_PLACEHOLDER/sonic-bridge-macos-aarch64"
                sha256 "SHA_MACOS_ARM_PLACEHOLDER"
              else
                url "https://github.com/Xuepoo/sonic-bridge/releases/download/vVERSION_PLACEHOLDER/sonic-bridge-macos-x86_64"
                sha256 "SHA_MACOS_X86_PLACEHOLDER"
              end
            end

            on_linux do
              url "https://github.com/Xuepoo/sonic-bridge/releases/download/vVERSION_PLACEHOLDER/sonic-bridge-linux-x86_64"
              sha256 "SHA_LINUX_PLACEHOLDER"
            end

            def install
              if OS.mac?
                if Hardware::CPU.arm?
                  bin.install "sonic-bridge-macos-aarch64" => "sonic-bridge"
                else
                  bin.install "sonic-bridge-macos-x86_64" => "sonic-bridge"
                end
              elsif OS.linux?
                bin.install "sonic-bridge-linux-x86_64" => "sonic-bridge"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sonic-bridge --version")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/sonic-bridge.rb
          sed -i "s/SHA_MACOS_ARM_PLACEHOLDER/${{ steps.sha.outputs.sha_macos_arm }}/g" Formula/sonic-bridge.rb
          sed -i "s/SHA_MACOS_X86_PLACEHOLDER/${{ steps.sha.outputs.sha_macos_x86 }}/g" Formula/sonic-bridge.rb
          sed -i "s/SHA_LINUX_PLACEHOLDER/${{ steps.sha.outputs.sha_linux }}/g" Formula/sonic-bridge.rb

          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add Formula/sonic-bridge.rb
          git commit -m "chore: update sonic-bridge to v${VERSION}" || true
          git push

  publish-scoop:
    name: Publish to Scoop Bucket
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256 and Update
        run: |
          VERSION="${{ github.ref_name }}"
          CLEAN_VERSION=${VERSION#v}
          SHA_WIN=$(sha256sum artifacts/sonic-bridge-windows-x86_64/sonic-bridge-windows-x86_64.exe | awk '{print $1}')

          REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/Xuepoo/scoop-bucket.git"
          git clone "${REPO_URL}" bucket
          cd bucket
          mkdir -p bucket

          cat > bucket/sonic-bridge.json << EOF
          {
            "version": "${CLEAN_VERSION}",
            "description": "An ultra-fast, lightweight physical music aesthetic and listening translation middleware designed for AI Agents",
            "homepage": "https://github.com/Xuepoo/sonic-bridge",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/Xuepoo/sonic-bridge/releases/download/v${CLEAN_VERSION}/sonic-bridge-windows-x86_64.exe",
                "hash": "${SHA_WIN}",
                "bin": [["sonic-bridge-windows-x86_64.exe", "sonic-bridge"]]
              }
            },
            "checkver": {
              "github": "https://github.com/Xuepoo/sonic-bridge"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/Xuepoo/sonic-bridge/releases/download/v\$version/sonic-bridge-windows-x86_64.exe"
                }
              }
            }
          }
          EOF

          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add bucket/sonic-bridge.json
          git commit -m "chore: update sonic-bridge to v${CLEAN_VERSION}" || true
          git push
