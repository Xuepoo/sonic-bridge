name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sonic-bridge-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sonic-bridge-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sonic-bridge-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sonic-bridge-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sonic-bridge-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/sonic-bridge ${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/sonic-bridge.exe ${{ matrix.artifact_name }}.exe

      - name: Package for Linux distributions
        if: runner.os == 'Linux'
        run: |
          ARCH_TYPE=$(uname -m)
          if [ "$ARCH_TYPE" = "aarch64" ]; then
            NFPM_ARCH="arm64"
            ARCH="arm64"
            PKG_ARCH="aarch64"
          else
            NFPM_ARCH="x86_64"
            ARCH="amd64"
            PKG_ARCH="x86_64"
          fi
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm

          # Prepare binary for nFPM
          cp ${{ matrix.artifact_name }} ./sonic-bridge
          chmod +x ./sonic-bridge

          # Extract version robustly
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" == refs/heads/* ]] || [[ "$VERSION" == refs/pull/* ]] || [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi

          export VERSION
          export ARCH
          ./nfpm pkg --packager deb --target sonic-bridge-linux-${PKG_ARCH}.deb
          ./nfpm pkg --packager rpm --target sonic-bridge-linux-${PKG_ARCH}.rpm
          ./nfpm pkg --packager archlinux --target sonic-bridge-linux-${PKG_ARCH}.pkg.tar.zst

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            *.deb
            *.rpm
            *.pkg.tar.zst

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish sonic-bridge
        run: cargo publish --no-verify --allow-dirty || echo "Crate version might already be published, skipping..."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib sudo fakeroot binutils make gcc pkgconf

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # Sync to /root/.ssh for standard ssh client compatibility in containers
          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

      - name: Configure Git
        run: |
          git config --system --add safe.directory '*'
          git config --global user.name "Xuepoo (CI)"
          git config --global user.email "xuepoofoter@gmail.com"

      - name: Create Arch AUR builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Update AUR source package (sonic-bridge)
        run: |
          git clone ssh://aur@aur.archlinux.org/sonic-bridge.git aur-src
          cd aur-src
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}
          sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

      - name: Update AUR binary package (sonic-bridge-bin)
        run: |
          git clone ssh://aur@aur.archlinux.org/sonic-bridge-bin.git aur-bin
          cd aur-bin
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}
          sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master
