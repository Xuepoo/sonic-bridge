[package]
name = "sonic-bridge"
version = "0.7.0"
edition = "2021"
description = "An ultra-fast, lightweight physical music aesthetic and listening translation middleware designed for AI Agents under the LRMD protocol."
license = "MIT"
repository = "https://github.com/Xuepoo/sonic-bridge"
homepage = "https://github.com/Xuepoo/sonic-bridge"
readme = "README.md"
keywords = ["music-analysis", "dsp", "ai-agent", "chroma", "dtw"]


[dependencies]
symphonia = { version = "0.5.3", features = ["all"] }
rustfft = "6.1.0"
ndarray = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
unicode-normalization = "0.1.22"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
